session_name: vlm_ros_alphaz_bag_direct
start_directory: /home/all/AlphaZ/SysNav

# Thin runner for the scene-graph pipeline on a go2w bag fed by its own LIO (no
# arise_slam). One bringup launch (tare_planner scene_graph.launch) starts the
# whole pipeline with all config baked in: static <ns>/odom->map tf, detection,
# semantic_mapping, room_segmentation, vlm, planner(+exporter), and RViz.
#
# Everything configurable lives in yamls (robot_namespace, topics, calibration
# source, export identifiers). The ONLY per-run knobs are in the bag window
# below: which bag, --start-offset, --playback-duration.

shell_command_before:
  - source /home/all/AlphaZ/SysNav/install/setup.zsh

windows:
  - window_name: stack
    layout: tiled
    panes:
      - shell_command:
          # Whole pipeline (configs baked into scene_graph.launch). The sleep lets
          # the paused bag below bring /clock alive before the planner boots,
          # avoiding the 0 -> bag-time clock jump that crashes TARE. Override
          # rviz:=false to skip RViz.
          - sleep 5
          - ros2 launch tare_planner scene_graph.launch

  - window_name: bag
    layout: tiled
    panes:
      - shell_command:
          # PER-RUN KNOBS: bag path, --start-offset, --playback-duration.
          # Starts paused (so /clock is alive at the bag start time before the
          # stack boots), then auto-resumes once the stack is up.
          - >
            ros2 bag play /home/all/AlphaZ/bags/multifloor_test_slam_ros2
            --start-offset 232 --playback-duration 275
            --clock --start-paused --disable-keyboard-controls < /dev/null &
          - sleep 15
          - ros2 service call /rosbag2_player/resume rosbag2_interfaces/srv/Resume "{}"
          # Primer: replay the main bag's own /tf_static (the full go2w_016 robot
          # tree incl. base->front_cam->front_cam_ar) which --start-offset skips.
          # Needed by the camera<-base tf calibration in semantic_mapping + the
          # planner. Comes up AFTER resume so only the main player offers
          # /rosbag2_player/resume (no service-name collision). No --clock here.
          - >
            ros2 bag play /home/all/AlphaZ/bags/multifloor_test_slam_ros2
            --topics /tf_static --loop --disable-keyboard-controls < /dev/null &
      - shell_command:
          - "# Probes / manual snapshot trigger (run by hand):"
          - "# ros2 topic hz /room_nodes_list"
          - "# ros2 topic pub --once /keyboard_input std_msgs/String \"{data: 'ssg'}\""
