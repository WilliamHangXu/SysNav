# Explicit allowlist for ros1_bridge `parameter_bridge` — the only topics that
# cross between the robot's ROS 1 master and the ROS 2 scene-graph pipeline.
#
# Why this instead of dynamic_bridge (selective):
#   - Bridges are created EAGERLY at startup (no discovery over the robot's 300+
#     topic graph) and eagerly subscribe on the ROS 1 side, which wakes the lazy
#     image_proc rectify nodelet immediately -> camera_info flows before the
#     pipeline boots.
#   - /tf_static is published with transient_local durability, so the latched
#     static transforms (e.g. base->front_cam_ar) reach the pipeline's tf listener
#     INSTANTLY on subscribe -- no latched-delivery race, no ~30s wait.
# NOTHING is hardcoded here -- no transforms/intrinsics, and NO robot name. The
# `__NS__` token below is the per-robot namespace; the `param-bridge` entrypoint
# substitutes it from `robot_namespace` in robot.yaml (the single source of truth,
# mounted into the container) before `rosparam load`. So robot.yaml stays the ONE
# place the robot name lives -- this file is robot-agnostic.
#
# NOTE: parameter_bridge bridges every listed topic BIDIRECTIONALLY (no per-topic
# direction). For these inputs only the robot publishes, so 2->1 carries nothing,
# except /tf,/tf_static where the laptop's odom->map static also goes to the robot
# (harmless -- the selective bridge already does this).
#
# Usage: the entrypoint renders __NS__ -> <robot_namespace>, `rosparam load`s the
# result onto the robot's ROS 1 master, then runs `parameter_bridge` (reads it as
# /topics). Live config: no /clock (use_sim_time:=false).
topics:
  - topic: /__NS__/cloud_registered
    type: sensor_msgs/msg/PointCloud2
    queue_size: 10
  - topic: /__NS__/lio/odometry
    type: nav_msgs/msg/Odometry
    queue_size: 50
  # Camera arrives COMPRESSED (JPEG) to keep the WiFi hop cheap -- bridging raw
  # frames was saturating it. The in-container `camera_decompress` republish node
  # (scene_graph.launch, live/demo only) decodes this back to the raw
  # /<ns>/camera/image_rect_color the pipeline consumes. The robot must publish
  # this image_transport sub-topic (it does: .../image_rect_color/compressed).
  - topic: /__NS__/camera/image_rect_color/compressed
    type: sensor_msgs/msg/CompressedImage
    queue_size: 5
  - topic: /__NS__/camera_rect/camera_info
    type: sensor_msgs/msg/CameraInfo
    queue_size: 5
  # /clock — only carries data in bag mode (rosbag --clock on the ROS 1 side, so
  # the ROS 2 pipeline can run use_sim_time:=true). Idle/harmless on the live
  # robot (wall clock). Not namespaced.
  - topic: /clock
    type: rosgraph_msgs/msg/Clock
    queue_size: 10
  - topic: /tf
    type: tf2_msgs/msg/TFMessage
    queue_size: 100
  - topic: /tf_static
    type: tf2_msgs/msg/TFMessage
    queue_size: 100
    qos:
      reliability: reliable
      durability: transient_local
  # Demo-mode control channel (MODE=demo). The robot drives the run with String
  # keywords on /request (start|complete|cancel|received); the container streams
  # the scene-graph JSON back on /response. Global (no __NS__) -- robot-agnostic
  # control. /response is the first topic to actually use the 2->1 direction;
  # parameter_bridge already bridges every listed topic both ways. Idle/harmless
  # in live/bag/bag-direct modes (nothing publishes them).
  - topic: /scene_graph_generator/request
    type: std_msgs/msg/String
    queue_size: 10
  - topic: /scene_graph_generator/response
    type: std_msgs/msg/String
    queue_size: 10
