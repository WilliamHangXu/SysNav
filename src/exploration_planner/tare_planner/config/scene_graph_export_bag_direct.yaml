# Configuration for the GADM-style scene-graph JSON exporter.
# Loaded by tare_planner_node alongside the scenario yaml (both files key on the
# same node name, so ROS merges them). See SceneGraphExportConfig.
tare_planner_node:
  ros__parameters:
    # --- room-type query debug log ---
    # When true, every /room_type_query payload (scalar fields as JSON + the
    # crop and mask images) is dumped to <run_dir>/room_type_queries/. Off by
    # default; flip to true to debug room labeling.
    room_type_query_log.enabled: false

    # --- behavior ---
    scene_graph_export.enabled: true
    scene_graph_export.output_root: "output/scene_graph"  # per-run subfolder created here
    scene_graph_export.save_interval_s: 60.0              # <= 0 disables periodic snapshots
    scene_graph_export.end_of_bag_save: true             # final snapshot when /clock stalls (sim time)
    scene_graph_export.bag_end_timeout_s: 15.0            # wall-clock stall before "bag over"
    scene_graph_export.manual_save_keyword: "ssg"       # /keyboard_input trigger for on-demand dump

    # --- world-frame transform ---
    # Bag-direct path: /registered_scan and /state_estimation already come from
    # the bag's own LIO in the bag's `world` frame (labelled "map" by
    # bag_slam_bridge, with a static identity world->map). The scene graph is
    # therefore already in world coordinates, so no map->world transform is
    # needed — disabled here. (The arise path uses scene_graph_export.yaml,
    # which keeps this enabled.)
    scene_graph_export.world_transform.enabled: false
    scene_graph_export.world_transform.world_frame: "world"
    scene_graph_export.world_transform.livox_frame: "go2w_005/livox_frame"
    scene_graph_export.world_transform.map_frame: "map"
    scene_graph_export.world_transform.sensor_frame: "sensor"
    # G = arise's per-run imu_laser_R_Gravity (row-major 3x3). MUST match
    # cloud_image_fusion.py:411 and arise's stdout for THIS bag; identity
    # disables the rotation. Re-read it for any new bag / IMU init / remount.
    scene_graph_export.world_transform.gravity_matrix:
      [0.978664, 0.0, -0.205469, 0.00283797, 0.999905, 0.0135174, 0.205449, -0.0138121, 0.97857]

    # --- single zone bucket for all rooms ---
    scene_graph_export.zone: "all"

    # --- top-level identifiers (written verbatim into the JSON) ---
    scene_graph_export.map_id: "HomeBuilding_test"
    scene_graph_export.warehouse_id: "HomeBuilding_test"
    scene_graph_export.name: "HomeBuilding_test"
    scene_graph_export.client_id: "alphaz"
    scene_graph_export.uploaded_by: "WilliamXu"

    # --- layout.metadata ---
    scene_graph_export.units: "meters"
    # Which bag frame the coordinates are in. The go2w_016 multifloor_test_slam
    # bag has no `world` frame — /registered_scan, /state_estimation and
    # /terrain_map all come from the LIO in `go2w_016/odom` (start-anchored:
    # origin at robot start). Written verbatim into layout.metadata.frame.
    scene_graph_export.frame: "odom"
    scene_graph_export.building: "HomeBuilding"
    scene_graph_export.floor_level: 1
    scene_graph_export.floor_id: "floor_04"
