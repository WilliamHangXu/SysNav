# Per-robot / per-platform switch. All robots run the same nav stack, so only
# the namespace differs between platforms (go2w_016, go2_003, ...). This is the
# ONE file to edit when moving to a different robot or bag; the scenario tuning
# (go2w_bag_direct.yaml) and semantic config (mapping_go2w_bag.yaml) are reused
# unchanged across robots.
#
# Every scene-graph node composes its robot-source input topics as
# /<robot_namespace>/<suffix> and its tf frames as <robot_namespace>/<frame>;
# internal stack topics stay constant. Loaded for the planner / room_segmentation
# via the bringup launch's robot_config arg, and directly by the go2w
# semantic_mapping / detection launches.
/**:
  ros__parameters:
    robot_namespace: go2w_005

    # --- registered cloud + odometry source --------------------------------
    # Every scene-graph node consumes a registered (odom-frame) point cloud and
    # the matching odometry. The two are ALWAYS switched together as one
    # trajectory, so the cloud and the poses can never drift apart:
    #   bag         the bag / robot already runs SLAM -- read it directly:
    #                 cloud = /<ns>/cloud_registered   odom = /<ns>/lio/odometry
    #   slam_bridge no on-board registered cloud -- bag_slam_bridge registers the
    #               raw lidar instead and publishes the matching odometry:
    #                 cloud = /<ns>/cloud_registered   odom = /<ns>/state_estimation
    #               (scene_graph.launch then starts the bridge; the ros1_bridge
    #                carries /<ns>/livox/lidar instead of /<ns>/cloud_registered.)
    registered_scan_source: slam_bridge

    # Raw lidar feeding bag_slam_bridge -- only used when source == slam_bridge.
    # Defaults suit the go2w Livox (CustomMsg). Use 'pointcloud2' + a PointCloud2
    # topic suffix for a non-Livox lidar.
    slam_bridge.lidar_msg_type: livox
    slam_bridge.lidar_topic_suffix: livox/lidar
