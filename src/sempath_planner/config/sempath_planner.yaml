sempath_planner:
  ros__parameters:
    # ---- map save ("export" on /keyboard_input) -----------------------------
    dump_dir: "output/sempath_export"   # where tare_planner + bev_mapper write their dumps
                                        # (relative to sysnav_root)
    sysnav_root: ""                     # "" = node cwd (the teleop scripts cd to the repo root);
                                        # must contain tools/ and the SemPathBench/ checkout
    run_group: "sim"                    # platform subfolder under resources/maps/real (the teleop
                                        # launches pass sim / robot); every export writes a NEW map
                                        # real/<run_group>/<YYYYmmdd_HHMMSS>_train — one folder per
                                        # run, nothing overwritten ("" = ungrouped, real/<stamp>_train)
    dump_wait_timeout_s: 20.0           # max wait for fresh dump files after "export"
    make_overview: false                # also render <map_id>_overview.png on every save (slower)
    exclude_objects_yaml: "tools/sempath_export/exclude_objects.yaml"
                                        # object exclusion list {exclude: [label, ...]} — listed
                                        # objects are left out of the map entirely; RE-READ at every
                                        # export, so edit + re-export, no restart. Entries match raw
                                        # ("trash can") and aliased ("GarbageCan") names.
                                        # "" = converter default (drop "person" only)

    # ---- planning ("plan <instruction>") ------------------------------------
    grounding_variant: "direct_cap_repair"  # GroundPlan variant (upstream's canonical default; full | direct_cap | ir_to_code | ...)
    llm_timeout_s: 90.0                 # per Gemini request ($GEMINI_API_KEY, model via $GEMINI_MODEL)

    # ---- annotator browser UI (status feedback) -----------------------------
    # The SemPathBench instruction annotator is served in-process; after "export"
    # the browser opens once on the fresh map. "plan" opens NO new tab — the RViz
    # path + "plan ready" log line are the "type 'go'" signal (a &plan=live preview
    # URL is logged for a manual look at the route in the browser).
    ui:
      enabled: true
      host: "127.0.0.1"
      port: 8010                        # falls back to an ephemeral port if taken
      open_browser: true                # false: only log the URL, never open tabs

    # ---- semantic map overlay in RViz ---------------------------------------
    # After every export the converted map render (rooms / objects / occupancy,
    # same colors as the browser UI) is published once as a flat cell layer on
    # /sempath_map/markers (transient_local, SLAM map frame) — the "SemPath Map"
    # display in tare_planner_teleop.rviz.
    map_viz:
      enabled: true
      z: 0.0                            # height of the layer (m) — per-platform: the launches pass
                                        # map_viz_z (sim 0.0 = floor; robot -0.35, the ARISE map
                                        # origin sits at sensor start height ~0.4 m above ground,
                                        # so 0 would cover the robot/path markers); tune the number
                                        # in scene_graph_real_robot.launch if it still floats
      alpha: 1.0                        # per-cell opacity (< 1.0 to see the point cloud through it)

    # ---- "shutdown": kill the map-building pipeline -------------------------
    # Once a good map is exported, the scene-graph side (YOLO, SAM, room seg,
    # VLM, BEV) is dead weight for path following — "shutdown" SIGINTs these
    # processes (SIGKILL after 8 s), matched by executable basename. Base
    # autonomy, this node, the keyboard terminal and RViz keep running, so
    # plan/go/stop/clear still work; "export" then needs a full stack restart.
    mapping_processes: ["tare_planner_node", "room_segmentation", "detection_node",
                        "semantic_mapping_node", "vlm_reasoning_node", "bev_mapper_node"]

    # ---- execution ("go") ---------------------------------------------------
    odom_topic: "/state_estimation"
    speed: 1.0                          # m/s handed to /speed while following
    rdp_epsilon_m: 0.15                 # path simplification tolerance (corners survive)
    max_spacing_m: 1.5                  # max distance between consecutive waypoints
    arrival_radius_m: 0.5               # advance to the next waypoint within this distance
    final_arrival_radius_m: 0.3         # tighter radius for the goal waypoint
    waypoint_timeout_s: 60.0            # abort if a waypoint is not reached in time
    follow_rate_hz: 2.0                 # /way_point + /speed publish rate while following
