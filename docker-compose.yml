# Local GPU smoke-test of the same image that ships to AWS.
# Usage:
#   docker compose build
#   BAG_HOST=/home/all/AlphaZ/bags/<your_bag_dir> \
#   GEMINI_API_KEY=xxx docker compose up
#
# On AWS you would NOT use this file — you run the image from ECR on an EC2 GPU
# instance / AWS Batch and pass BAG_S3_URI + OUTPUT_S3_URI instead of a mount.
services:
  sysnav:
    build:
      context: .
      dockerfile: Dockerfile
    image: sysnav:latest
    # ROS 2 DDS discovery is simplest on the host network stack.
    network_mode: host
    ipc: host
    environment:
      # Local mode: bag is mounted (below), so no S3 pull.
      BAG_LOCAL: /data/bag
      AUTOPLAY_DELAY: "15"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      VLM_PROVIDER: "${VLM_PROVIDER:-}"
    volumes:
      - "${BAG_HOST:?set BAG_HOST to a local ros2 bag directory}:/data/bag:ro"
      - "./output:/app/output"
      - "./runlogs:/app/runlogs"
      # Local-dev convenience: overlay the launch scripts from the host so edits
      # to entrypoint.sh / run_system.sh apply on the next `up` with no rebuild.
      # (The image still bakes these for AWS, where this mount isn't used.)
      - "./docker:/app/docker:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
