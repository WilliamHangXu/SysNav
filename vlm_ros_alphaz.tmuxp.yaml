session_name: vlm_ros_alphaz
start_directory: /home/all/AlphaZ/SysNav

shell_command_before:
  - source /home/all/AlphaZ/SysNav/install/setup.zsh

windows:
  - window_name: core
    layout: tiled
    panes:
      - shell_command:
          - "# 1. SLAM"
          - ros2 launch arise_slam_mid360 arize_slam_go2w.launch.py
      - shell_command:
          - "# 2. Detection (YOLO)"
          - sleep 3
          - ros2 launch semantic_mapping detection_node_go2w.launch
      - shell_command:
          - "# 3. Semantic mapping + door panel perception"
          - sleep 3
          - ros2 launch semantic_mapping semantic_mapping_go2w.launch
      - shell_command:
          - "# 4. Room segmentation"
          - sleep 5
          - >
            ros2 launch tare_planner room_segmentation.launch
            use_sim_time:=true scenario:=matterport_bagfile
            door_pipeline_log_level:=info

  - window_name: gadm
    layout: tiled
    panes:
      - shell_command:
          - "# 5. Mission manager"
          - sleep 5
          - ros2 launch mission_manager mission_manager.launch use_sim_time:=true config:=gadm
      - shell_command:
          - "# 6. VLM reasoning"
          - sleep 5
          - ros2 launch vlm_node vlm_node.launch use_sim_time:=true config:=vlm_config
      - shell_command:
          - "# 7. Planner (needs /clock alive — bag starts paused below)"
          - sleep 10
          - >
            ros2 launch tare_planner explore.launch
            use_sim_time:=true scenario:=matterport_bagfile
      - shell_command:
          - "# 8. RViz"
          - sleep 5
          - >
            rviz2 -d /home/all/AlphaZ/SysNav/src/exploration_planner/tare_planner/tare_planner_ground.rviz
            --ros-args -p use_sim_time:=true

  - window_name: bag
    panes:
      - shell_command:
          - "# 9. Bag (paused — press SPACE when planner is up)"
          - >
            ros2 bag play /home/all/AlphaZ/bags/rosbag_B03W-Mission-Camera-Point-Update_date-09april2026_time-20-37-00_currenttime-20-38-02-20260410T230756Z-3-0_ros2
            --clock --start-paused
      - shell_command:
          - "# 10. Probes / snapshot trigger — manual"
          - "# ros2 topic hz /room_nodes_list"
          - "# ros2 topic pub --once /gadm_snapshot_request tare_planner/msg/GadmSnapshotRequest \"{request_id: 'test_001'}\""
